<!DOCTYPE html>
<html>
<head>
    <title>School Admission Form</title>
</head>
<body>

<h2>School Admission Form</h2>

<form>
    <p>
        Student Name:
        <input type="text" maxlength="40" required>
    </p>

    <p>
        Date of Birth:
        <input type="date" required>
    </p>

    <p>
        Grade Applying For:
        <input type="number" min="1" max="12" required>
    </p>

    <p>
        Parent Contact Number:
        <input type="text" required>
    </p>

    <input type="submit" value="Apply">

</form>

</body>
</html>

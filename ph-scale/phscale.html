<!DOCTYPE html>
<html>
<head>
    <title>pH Scale</title>

    <style>
        body {
            font-family: Arial;
        }

        h2 {
            text-align: center;
        }

        .box {
            padding: 10px;
            color: white;
        }

        .alkaline {
            background-color: #2b7cff;
        }

        .light-alkaline {
            background-color: #6aa9ff;
        }

        .neutral {
            background-color: #2ecc71;
            color: black;
            font-weight: bold;
        }

        .acid {
            background-color: #ff7a7a;
        }

        .strong-acid {
            background-color: #ff3b3b;
        }
    </style>
</head>

<body>
    <h2>pH Scale</h2>
         <div class="box alkaline">14 - Very Alkaline</div>
            <div class="box alkaline">13</div>
                <div class="box alkaline">12</div>
                    <div class="box light-alkaline">11</div>
                        <div class="box light-alkaline">10</div>
                            <div class="box light-alkaline">9</div>
                                <div class="box light-alkaline">8</div>
                            <div class="box neutral">7 - Neutral</div>
                        <div class="box acid">6</div>
                    <div class="box acid">5</div>
                <div class="box acid">4</div>
            <div class="box strong-acid">3</div>
        <div class="box strong-acid">2</div>
    <div class="box strong-acid">1</div>
        <div class="box strong-acid">0 - Very Acidic</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multiple Steps Form (HTML Only)</title>
</head>
<body>

<h2>Multi Step Form (HTML Only)</h2>

<!-- Step 1 -->
<div id="step1">
    <form action="#step2">
        <p>First Name: <input type="text" name="first" required></p>
        <p>Last Name: <input type="text" name="last" required></p>
        <p><input type="submit" value="Next"></p>
    </form>
</div>

<!-- Step 2 -->
<div id="step2">
    <form action="#step3">
        <p>Email: <input type="email" name="email" required></p>
        <p>Phone Number: <input type="text" name="phone" required></p>
        <p><a href="#step1">Previous</a> <input type="submit" value="Next"></p>
    </form>
</div>

<!-- Step 3 -->
<div id="step3">
    <form action="#">
        <p>Username: <input type="text" name="username" required></p>
        <p>Password: <input type="password" name="password" required></p>
        <p><a href="#step2">Previous</a> <input type="submit" value="Submit"></p>
    </form>
</div>

</body>
</html>
